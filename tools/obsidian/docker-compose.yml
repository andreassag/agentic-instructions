# obsidian-ai — Docker Compose
# Source: https://github.com/sup3rus3r/obsidian-ai
#
# USAGE:
#   1. Copy this file next to your obsidian-ai clone directory, OR place it
#      inside your obsidian-ai project root.
#   2. Create a .env file (see tools/obsidian/SETUP.md for all variables).
#   3. docker compose up -d
#
# Ports:
#   Backend  → http://localhost:8000  (FastAPI / REST + SSE)
#   Frontend → http://localhost:3000  (Next.js UI)

services:
  backend:
    image: python:3.12-slim
    container_name: obsidian-ai-backend
    working_dir: /app
    volumes:
      # Mount your local obsidian-ai clone:
      - ./obsidian-ai/backend:/app
      # Persistent storage for SQLite database, uploads, and FAISS indexes
      - obsidian_data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/obsidian.db}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    command: >
      sh -c "pip install --quiet -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: node:20-alpine
    container_name: obsidian-ai-frontend
    working_dir: /app
    volumes:
      # Mount your local obsidian-ai clone:
      - ./obsidian-ai/frontend:/app
      # Persist node_modules to avoid reinstalling on every restart
      - frontend_node_modules:/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    command: >
      sh -c "npm install --quiet &&
             npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  obsidian_data:
    driver: local
  frontend_node_modules:
    driver: local
