# Stack Profile Schema
# Every profile.yaml in /profiles/ must conform to this structure.
# Required fields: name, version, description, skills

type: object
required:
  - name
  - version
  - description
  - skills

properties:
  name:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: "Unique profile identifier (lowercase, hyphens only)"

  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: "Semantic version (e.g. 1.0.0)"

  description:
    type: string
    description: "Human-readable description of this profile"

  extends:
    type: string
    description: "Optional: name of another profile to inherit from"

  skills:
    type: array
    items:
      type: string
    description: >
      Skills to deploy for this profile. Each entry is a skill directory name
      (e.g. go-guidelines, rtk, clean-code, test-runner). The entire skill
      subfolder is deployed as a unit. Tool skills (rtk, qmd, graphify) are
      also listed here; tech-guideline skills (go-guidelines, python-guidelines,
      etc.) replace the former 'instructions' array.
