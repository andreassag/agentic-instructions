name: security-audit
version: 1.0.0
description: Security-focused code audit agent — secret scanning, dependency vulnerabilities, SAST patterns, and hardening review.

instructions:
  agent:
    - agent/safety.md
    - agent/code-review.md
    - agent/communication.md
    - agent/planning.md
  tech:
    - tech/bash.md
    - tech/python.md
  context:
    - context/library.md
    - context/service.md

skills:
  - security/secret-scan.sh
  - deps/audit.sh
  - review/pr-checklist.sh
  - git/commit-lint.sh

tools:
  required:
    - rtk
  optional:
    - graphify

platforms:
  default:
    - claude
    - antigravity
  supported:
    - claude
    - copilot
    - antigravity
    - vibe
    - codex

