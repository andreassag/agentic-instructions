name: docs-writer
version: 1.0.0
description: Technical documentation agent — READMEs, API docs, changelogs, and architectural decision records.

instructions:
  agent:
    - agent/communication.md
    - agent/documentation.md
    - agent/planning.md
  tech:
    - tech/bash.md
  context:
    - context/library.md

skills:
  - git/commit-lint.sh
  - docs/changelog-entry.sh
  - review/pr-checklist.sh

tools:
  required:
    - rtk
  optional:
    - qmd
    - graphify

platforms:
  default:
    - claude
    - antigravity
    - copilot
  supported:
    - claude
    - copilot
    - antigravity
    - vibe
    - codex

