name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    name: Create Semver Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes & Installation Instructions
        id: release_notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [[ -n "$PREV_TAG" ]]; then
            CHANGELOG=$(git log "${PREV_TAG}..${TAG}" --oneline --no-merges || echo "No commit history found.")
          else
            CHANGELOG=$(git log -n 25 --oneline --no-merges || echo "Initial release.")
          fi

          cat > release_body.md <<EOF
          # Release ${TAG}

          ## Changes
          ${CHANGELOG}

          ---

          ## Installation & Setup

          ### Install this specific version (${TAG}):
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${TAG}/install.sh | bash -s -- --version ${TAG}
          \`\`\`

          ### Or clone specific tag:
          \`\`\`bash
          git clone --depth=1 -b ${TAG} https://github.com/${{ github.repository }}.git
          cd agentic-instructions && bash install.sh
          \`\`\`

          ### Upgrade existing installation to this version:
          \`\`\`bash
          bash install.sh --update --version ${TAG}
          \`\`\`

          ### Initialize a project workspace:
          \`\`\`bash
          # Initialize with a specific profile:
          hub init --profile full-stack-ts

          # Or list all available profiles:
          hub init --help-all
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body_path: release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
