name: Validate

on:
  push:
    branches: ["main", "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Run validate.sh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (jq, yq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq wget
          # Install mikefarah/yq (not the Go snap version)
          YQ_VERSION="v4.53.3"
          sudo wget -q "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Run validation suite
        run: bash validate.sh

      - name: Check for .gitignore hygiene
        run: |
          # Fail if any .sif files or secrets patterns are tracked
          if git ls-files | grep -qE '\.(sif|sqfs|pem|key|p12|pfx)$'; then
            echo "ERROR: Binary or secret files are tracked. Update .gitignore."
            exit 1
          fi
          echo "✓ No sensitive file types tracked"
